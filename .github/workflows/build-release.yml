name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/fleet-management.jks
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -s "app/fleet-management.jks" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/fleet-management.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          else
            ./gradlew assembleRelease
          fi

      - name: Find and Stage APK
        run: |
          if [ -f "android/app/build/outputs/apk/release/fleet-management.apk" ]; then
            cp android/app/build/outputs/apk/release/fleet-management.apk fleet-management.apk
          else
            cp android/app/build/outputs/apk/release/*.apk fleet-management.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: fleet-management.apk
          generate_release_notes: true

      - name: Upload Artifact (on manual workflow dispatch)
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') != true
        with:
          name: fleet-management-apk
          path: fleet-management.apk
