<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2528">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Fleet Management</title>
<style>
:root{--fog:#ECEEEA;--ink:#1F2528;--sig:#F2B705;--free:#2F6B57;--busy:#B8412F;--held:#8A6D00;--line:#D3D7D0;--card:#FAFBF9;--mute:#5B6468}
*{box-sizing:border-box}
body{margin:0;background:var(--fog);color:var(--ink);font:16px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:repeating-linear-gradient(90deg,var(--sig) 0 20px,transparent 20px 34px)}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header small{display:block;font-weight:400;color:#B9C0C3;font-size:12px}
main{max-width:720px;margin:0 auto;padding:18px 14px}
h2{font-size:15px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card h3{margin:0;font-size:17px}.mute{color:var(--mute);font-size:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:5px;padding:2px 8px;border:1px solid currentColor}
.free,.completed,.approved{color:var(--free)}.busy,.in_use,.rejected,.off{color:var(--busy)}.held,.ready,.pending,.special{color:var(--held)}.cancelled{color:var(--mute)}
.ready{background:#FFF1B8}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.p{background:var(--sig);border-color:var(--sig)}button.d{color:var(--busy);border-color:var(--busy)}
button.g{border-color:transparent;color:#fff;padding:6px 8px}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sig);outline-offset:1px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}.ck{display:flex;align-items:center;font-weight:400;margin:14px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;color:#B9C0C3;padding:14px 4px;font-size:13px;position:relative}
nav button.on{color:#fff;box-shadow:inset 0 3px var(--sig)}
nav i{font-style:normal;background:var(--busy);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}
#modal>div{background:var(--fog);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:12px 14px;border-radius:8px;display:none;z-index:10;max-width:520px;margin:auto}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}.login h1{margin:0 0 4px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}.empty b{display:block;color:var(--ink);font-size:17px}
.q{font-size:14px;color:var(--mute);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.unread{border-left:4px solid var(--sig)}
.menu{position:relative}.dd{position:absolute;right:0;top:calc(100% + 12px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:240px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px #0003}.dd hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.allocated{color:var(--free)}.requested,.awaiting_special{color:var(--held)}
</style></head>
<body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script type="module" src="app.js"></script>
</body></html>
